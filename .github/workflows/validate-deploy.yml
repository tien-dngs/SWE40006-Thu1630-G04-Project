name: Validating and Deploy Taskboard

on:
  push:
    branches: ["main"]

jobs:

  validate-backend-container:
    name: Backend Integration Test (Docker)

    runs-on: self-hosted
    defaults:
      run:
      working-directory: server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Test Image
        run: |
          docker build -t taskboard-backend-test -f Dockerfile.test .

      - name: Run backend test inside docker container
        run: docker run --rm taskboard-backend-test

  validate-frontend:
    name: Frontend Unit Tests (Jest)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
      - name: Install Frontend Deps
        run: npm ci
      - name: Run Frontend Tests
        run: npm test

  ete-acceptance-tests:
    name: Playwright E2E Tests
    needs: [validate-frontend, validate-backend-container]
    runs-on: self-hosted
    defaults:
      run:
        working-directory: .
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Root dependencies
        run: npm ci
      - name: Install Playwright Browser and Deps
        run: npx playwright install --with-deps

      - name: Install & Start Backend (in background)
        run: |
          cd server
          npm ci
          node server.js &
          sleep 10 # Wait for server to fully boot

      - name: Run Playwright Tests (test:ete)
        run: npm run test:ete
        env:
          VITE_API_BASE_URL: http://localhost:4004
