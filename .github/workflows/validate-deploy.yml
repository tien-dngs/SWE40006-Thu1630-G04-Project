name: Validating and Deploy Taskboard

on:
  push:
    branches: ["main"]

jobs:

  validate-backend-container:
    name: Backend Integration Test (Docker)
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Test Image
        run: |
          docker build -t taskboard-backend-validation -f server/Dockerfile.test .

      - name: Run backend test inside docker container
        run: docker run --rm taskboard-backend-validation

  validate-frontend-container:
    name: Frontend Unit Tests (Jest)
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with: 
          node-version: '24'

      - name: Run frontend Jest tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Build Frontend Docker Image
        working-directory: frontend
        run: |
          docker build -t taskboard-frontend --build-arg VITE_API_BASE_URL=http://localhost:4004 .

  ete-acceptance-tests:
    name: Playwright E2E Tests
    needs: [validate-frontend-container, validate-backend-container]
    runs-on: self-hosted
    defaults:
      run:
        working-directory: .
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Root dependencies
        run: npm ci

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Backend dependencies
        working-directory: server
        run: npm ci

      - name: Install Playwright Browser and Deps
        run: npx playwright install --with-deps

      - name: Run Playwright Tests (test:ete)
        run: npx playwright test 
        env:
          VITE_API_BASE_URL: http://localhost:4004

      
